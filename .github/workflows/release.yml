name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build fat-jar
        run: ./gradlew :nacosbase-cli:shadowJar -Pnacosbase.version=${{ steps.version.outputs.VERSION }} --no-daemon

      - name: Stage release artifacts
        run: |
          mkdir -p release-assets
          cp nacosbase-cli/build/libs/nacosbase-${{ steps.version.outputs.VERSION }}.jar \
             release-assets/nacosbase-${{ steps.version.outputs.VERSION }}.jar
          cp scripts/nacosbase.sh release-assets/nacosbase.sh
          cp scripts/nacosbase.bat release-assets/nacosbase.bat
          chmod +x release-assets/nacosbase.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ### Installation

            **Option 1 — wrapper script (recommended, no extra JVM flags needed):**
            ```bash
            # Linux/macOS
            chmod +x nacosbase.sh && ./nacosbase.sh --help

            # Windows
            nacosbase.bat --help
            ```

            **Option 2 — direct jar:**
            ```bash
            java --enable-native-access=ALL-UNNAMED -jar nacosbase-${{ steps.version.outputs.VERSION }}.jar --help
            ```

            Requires Java 21+.
          generate_release_notes: true
          files: |
            release-assets/nacosbase-${{ steps.version.outputs.VERSION }}.jar
            release-assets/nacosbase.sh
            release-assets/nacosbase.bat
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish CLI to GitHub Packages
        run: ./gradlew :nacosbase-cli:publishReleasePublicationToGitHubPackagesRepository -Pnacosbase.version=${{ steps.version.outputs.VERSION }} --no-daemon --no-configuration-cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish core/infra to Maven Central
        run: |
          ./gradlew :nacosbase-core:publishReleasePublicationToStagingRepository \
                    :nacosbase-infra:publishReleasePublicationToStagingRepository \
                    -Pnacosbase.version=${{ steps.version.outputs.VERSION }} --no-daemon --no-configuration-cache
          cd build/staging-repo
          zip -r ../../maven-bundle.zip .
          cd ../..
          TOKEN=$(printf '%s' "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" | base64 -w 0)
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@maven-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
